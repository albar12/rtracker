name: rtracker
description: An RTracker Apps
publish_to: "none"
version: 1.2.13+11

environment:
  sdk: ">=2.17.5 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: 8.1.1
  flutter_bloc: 8.1.2
  get: 4.6.5
  package_info_plus: 3.0.3
  shimmer: 2.0.0
  path_provider: 2.0.14
  dio: 5.1.1
  shared_preferences: 2.1.0
  intl: 0.18.0
  file_picker: 5.2.7
  photo_view: 0.14.0
  loader_overlay: 2.1.0
  flutter_spinkit: 5.1.0
  basic_utils: 5.5.3
  flutter_local_notifications: 13.0.0
  back_button_interceptor: 6.0.2
  realm: 1.0.3
  firebase_messaging: 14.4.0
  firebase_core: 2.9.0
  timelines: 0.1.0
  device_info_plus: 8.1.0
  flutter_background_service: 2.4.6
  loading_animation_widget: 1.2.0+4
  flutter_image_compress: 2.0.4
  mobile_scanner: 3.2.0
  permission_handler: 10.2.0
  image_picker: 1.0.1
  safe_device: 1.1.2
  syncfusion_flutter_signaturepad: 21.1.38
  flutter_svg: 2.0.5
  dotted_line: 3.1.0
  webview_flutter: 4.2.2
  collection: 1.18.0
  datetime_setting: 2.0.2
  camera: 0.10.5+2
  jiffy: 6.2.1
  maps_launcher: ^2.2.0
  mobile_number: ^2.1.1

dependency_overrides:
  geolocator: 9.0.1
  geolocator_android: 4.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 2.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/
    - asset/image/
  fonts:
    - family: Droid Sans
      fonts:
        - asset: asset/font/DroidSans.ttf
        - asset: asset/font/DroidSans-Bold.ttf
          weight: 700
