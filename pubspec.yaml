name: rtracker
description: An RTracker Apps
publish_to: "none"
version: 1.2.13+1

environment:
  sdk: ">=2.17.5 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  get: ^4.7.2
  package_info_plus: ^8.2.1
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  file_picker: ^9.0.0
  photo_view: ^0.15.0
  loader_overlay: ^5.0.0
  flutter_spinkit: ^5.2.1
  basic_utils: ^5.8.1
  flutter_local_notifications: ^18.0.1
  back_button_interceptor: ^8.0.4
  realm: ^20.0.1
  firebase_messaging: ^15.2.3
  firebase_core: ^3.12.0
  # timelines: 0.1.0
  timelines_plus: ^1.0.6
  device_info_plus: ^11.3.0
  flutter_background_service: ^5.1.0
  loading_animation_widget: ^1.3.0
  flutter_image_compress: ^2.4.0
  mobile_scanner: ^6.0.6
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  image_picker_android: ^0.8.12+21
  safe_device: ^1.2.0
  syncfusion_flutter_signaturepad: ^28.2.6
  flutter_svg: ^2.0.17
  dotted_line: ^3.2.3
  webview_flutter: ^4.10.0
  collection: 1.19.1
  datetime_setting: ^2.0.3
  camera: ^0.11.1
  jiffy: ^6.3.2
  maps_launcher: ^3.0.0+1
  get_phone_number: ^3.0.10

dependency_overrides:
  geolocator: ^13.0.2
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/
    - asset/images/
  fonts:
    - family: Droid Sans
      fonts:
        - asset: asset/font/DroidSans.ttf
        - asset: asset/font/DroidSans-Bold.ttf
          weight: 700
